<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="20">
    <defs>
        <style>
            .neon-line {
                stroke: #22d3ee;
                stroke-width: 2;
                filter: drop-shadow(0 0 5px #56d4dd);
            }
            .neon-dot {
                fill: #c084fc;
                filter: drop-shadow(0 0 5px #c084fc);
            }
            .neon-dash {
                stroke: #c084fc;
                stroke-width: 1;
                stroke-dasharray: 5 10;
            }
        </style>
    </defs>
    <!-- Background Dash -->
    <line x1="50" y1="10" x2="750" y2="10" class="neon-dash" />
    
    <!-- Central Neon Glowing Line -->
    <line x1="200" y1="10" x2="600" y2="10" class="neon-line" />
    
    <!-- Decorative Dots -->
    <circle cx="200" cy="10" r="3" class="neon-dot" />
    <circle cx="600" cy="10" r="3" class="neon-dot" />
    
    <!-- Diamond Centers -->
    <polygon points="400,5 405,10 400,15 395,10" class="neon-dot" fill="#22d3ee" />
</svg>
